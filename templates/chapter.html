<main id="main" tabindex="-1" class="book-wrap chapter-wrap">

  <div class="chapter-grid">
    $toc
    <article class="prose" id="chapter-text" tabindex="-1" aria-labelledby="chapter-heading">
      <h1 class="chapter-label" id="chapter-heading">$heading</h1>
      $text
    </article>
  </div>
  $chapter_end
</main>
