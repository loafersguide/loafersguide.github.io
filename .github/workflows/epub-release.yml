name: Publish the EPUB

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    concurrency:
      group: epub-release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Pandoc and EPUBCheck
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pandoc epubcheck
      - name: Build and validate the EPUB
        run: |
          python3 build.py epub
          epubcheck proofs/loafers-guide.epub
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          tag="epub-$short_sha"
          asset=proofs/loafers-guide.epub
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" == true ]]; then
              gh release upload "$tag" "$asset" --clobber
              gh release edit "$tag" --draft=false
            fi
          else
            gh release create "$tag" "$asset" \
              --target "$GITHUB_SHA" \
              --title "A Loafer’s Guide EPUB ($short_sha)" \
              --notes "EPUB built from commit $GITHUB_SHA."
          fi
